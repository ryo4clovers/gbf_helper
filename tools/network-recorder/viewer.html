<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>GBF Network Recorder — 記録データ</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 18px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .filters { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)); gap: 6px; flex: 1 1 720px; min-width: 280px; }
  .filters input { padding: 6px 8px; font-size: 13px; min-width: 0; }
  .toolbar button { padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { padding: 6px 14px; font-size: 13px; cursor: pointer; border: 1px solid #ccc; background: #f7f7f7; }
  .tabs button.active { background: #333; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { position: sticky; top: 0; background: #fafafa; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #f5f5f5; }
  .url { word-break: break-all; max-width: 480px; }
  .detail { display: none; background: #fafafa; }
  .detail pre { white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow: auto; font-size: 11px; }
  .detail img { max-width: 200px; max-height: 200px; display: block; }
  .actions { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .actions button { padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .action-status { font-size: 11px; color: #1e7e34; }
  #summary { font-size: 12px; color: #555; margin-bottom: 10px; }
  @media (max-width: 720px) {
    .filters { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
  }
  @media (max-width: 480px) {
    .filters { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1>GBF Network Recorder — 記録データ</h1>
  <div class="toolbar">
    <div class="filters" role="search" aria-label="URLのOR検索">
      <input class="filter" type="search" placeholder="URL検索 1" aria-label="URL検索条件1" />
      <input class="filter" type="search" placeholder="URL検索 2（OR）" aria-label="URL検索条件2" />
      <input class="filter" type="search" placeholder="URL検索 3（OR）" aria-label="URL検索条件3" />
      <input class="filter" type="search" placeholder="URL検索 4（OR）" aria-label="URL検索条件4" />
      <input class="filter" type="search" placeholder="URL検索 5（OR）" aria-label="URL検索条件5" />
      <input class="filter" type="search" placeholder="URL検索 6（OR）" aria-label="URL検索条件6" />
    </div>
    <button id="export">全件をJSONでエクスポート</button>
    <button id="exportFiltered">絞り込み結果をエクスポート</button>
    <button id="clear">全データ削除</button>
    <button id="reload">再読込</button>
  </div>
  <div id="summary"></div>
  <div class="tabs">
    <button id="tabApi" class="active">apiCalls</button>
    <button id="tabAssets">assets</button>
  </div>
  <table>
    <thead><tr id="theadRow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <script type="module" src="viewer.js"></script>
</body>
</html>
